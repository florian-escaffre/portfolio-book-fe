# _brand.yml: portfolio visual identity (soft palette, cream background)
# Quarto picks it up automatically when it sits next to _quarto.yml.

color:
  palette:
    # Backgrounds
    paper:      "#FBFBF9"   # near-white off-white (page background)
    paper-deep: "#F3F3F0"   # slightly deeper off-white (code blocks, callouts)
    white:      "#FFFFFF"
    # Text
    ink:        "#2B3A36"   # very dark green-grey, softer than pure black
    ink-soft:   "#6B7A75"   # secondary text
    # Pastel accents
    sage:       "#5E9C8E"   # soft sage / teal (primary accent)
    apricot:    "#E9BE7A"   # apricot (highlights)
    periwinkle: "#5F6DAE"   # muted periwinkle blue (links)
    rose:       "#D98C8C"   # dusty rose (soft alerts)
    mint:       "#8CCBB1"   # mint (success only)
  primary: sage
  secondary: sage
  tertiary: periwinkle
  success: mint
  info: periwinkle
  warning: apricot
  danger: rose
  light: paper-deep
  dark: ink
  foreground: ink
  background: paper
  link: periwinkle

typography:
  fonts:
    - family: Lora          # serif for headings
      source: google
      weight: [400, 600]
    - family: Inter         # sans-serif for body text
      source: google
      weight: [400, 500, 600]
    - family: Fira Code     # monospace for code blocks
      source: google
      weight: [400]
  base:
    family: Inter
    size: 1rem
    line-height: 1.7        # airy line spacing for readability
  headings:
    family: Lora
    weight: 600
    color: sage
  monospace:
    family: Fira Code
    size: 0.9em
    background-color: paper-deep
  link:
    color: periwinkle

# Identity shown in the browser tab / share cards
meta:
  name: Florian Escaffre · Data Science Portfolio