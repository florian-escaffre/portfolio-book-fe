project:
  type: book

book:
  title: "Data Science Portfolio"
  subtitle: "Master's in Smart Data Science, ENSAI · 2026–2027"
  author: "Florian Escaffre"
  date: today

  # Ordered list of chapters (files live in chapters/). Chapters 2 and 3 are
  # placeholders, filled in as the year goes on.
  chapters:
    - index.qmd
    - chapters/01-EDA.qmd
    - chapters/02-semester-2.qmd
    - chapters/03-semester-3.qmd
    - references.qmd

bibliography: references.bib

crossref:
  chapters: false

format:
  html:
    # Base theme: `cosmo` is just a starting point. Your personal style lives
    # in the two files beside this one:
    #   - `_brand.yml`  → colours + fonts (edit the hex values, done)
    #   - `styles.scss` → anything structural (see the file's comments)
    theme: cosmo
    css: styles.scss
    toc: true
    toc-title: "In this chapter"
    number-sections: false
    # Keep every figure and table labelled so your portfolio reads as a report,
    # not a pile of outputs.
    fig-cap-location: margin
